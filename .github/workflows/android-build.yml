name: Android APK build

on:
  pull_request:
  release:
    types:
      - published
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
      APITUBE_KEY: ${{ secrets.APITUBE_KEY }}
      NEWDATA_IO_KEY: ${{ secrets.NEWDATA_IO_KEY }}
      SEARCHCANS_API: ${{ secrets.SEARCHCANS_API }}
      SOCIAVAULT_KEY: ${{ secrets.SOCIAVAULT_KEY }}
      APIFY_KEY: ${{ secrets.APIFY_KEY }}
      OPUS_API_KEY: ${{ secrets.OPUS_API_KEY }}
      ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
      TIKTOK_CLIENT_ID: ${{ secrets.TIKTOK_CLIENT_ID }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKHUB_IO_KEY: ${{ secrets.TIKHUB_IO_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: hknyyyudeeemhyugzmja
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate environment file
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
          SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
          SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
          APITUBE_KEY=${APITUBE_KEY}
          NEWDATA_IO_KEY=${NEWDATA_IO_KEY}
          SEARCHCANS_API=${SEARCHCANS_API}
          SOCIAVAULT_KEY=${SOCIAVAULT_KEY}
          APIFY_KEY=${APIFY_KEY}
          OPUS_API_KEY=${OPUS_API_KEY}
          ZERNIO_KEY=${ZERNIO_KEY}
          TIKTOK_CLIENT_ID=${TIKTOK_CLIENT_ID}
          TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
          TIKHUB_IO_KEY=${TIKHUB_IO_KEY}
          NEWSAPI_KEY=${NEWSAPI_KEY}
          EOF

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Supabase migrations
        if: github.event_name != 'pull_request'
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Assemble release APK
        working-directory: ${{ github.workspace }}/android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixdown-release-apk
          path: ${{ github.workspace }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Deliver APK to private webhook
        if: ${{ secrets.APK_DELIVERY_WEBHOOK_URL != '' }}
        env:
          APK_DELIVERY_WEBHOOK_URL: ${{ secrets.APK_DELIVERY_WEBHOOK_URL }}
        run: |
          apk="$(find "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release" -name '*.apk' -print -quit)"
          test -n "$apk"
          curl --fail --silent --show-error --retry 3 \
            -F "file=@${apk}" \
            "$APK_DELIVERY_WEBHOOK_URL"

      - name: Attach APK to GitHub release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
