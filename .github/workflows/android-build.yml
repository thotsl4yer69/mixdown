name: Legacy Expo APK (manual only)

# The supported Mixdown release is native-android/. The Expo build is
# retained as a manual legacy fallback, not an automatic PR/release gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      # These are the ONLY runtime values app.config.js can expose to the mobile
      # bundle. Supabase URL + anon/publishable key are client-safe identifiers;
      # RLS is the actual data-security boundary. Keep every privileged provider,
      # database and service-role secret server-side.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Explain client configuration boundary
        run: |
          echo "Android build receives only client-safe Supabase/EAS configuration."
          echo "Ingestion/provider credentials belong in Supabase Edge Function secrets, never in the APK workflow."
          if [ -z "${SUPABASE_URL}" ]; then
            echo "SUPABASE_URL is not configured; build verification may still succeed but the artifact will not be connected to a backend."
          fi
          if [ -z "${SUPABASE_ANON_KEY}${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "No Supabase client key is configured; build verification may still succeed but the artifact will not have a usable Supabase client configuration."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Assemble release APK
        working-directory: ${{ github.workspace }}/android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixdown-release-apk
          path: ${{ github.workspace }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
