name: Mixdown Native emulator smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-emulator-smoke.yml"

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Prepare SDK and KVM
        shell: bash
        run: |
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" || test -d "$SDK_ROOT/platforms/android-35"
          sudo chmod 666 /dev/kvm || true
      - name: Assemble native app for emulator
        run: gradle --project-dir native-android :app:assembleDebug --no-daemon
      - name: Start emulator and verify live feed screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          # Default AOSP image avoids Pixel Launcher first-boot ANR observed in the previous screenshot.
          target: default
          script: bash .github/scripts/native-emulator-smoke.sh
      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixdown-emulator-smoke
          path: native-android/smoke-output/
          if-no-files-found: warn
